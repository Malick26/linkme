name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contrat OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npx -y @redocly/cli@latest lint services/api/src/main/resources/openapi/openapi.yaml
      - name: Le client TS généré est à jour
        working-directory: apps/web
        run: |
          node scripts/gen-api.mjs
          git diff --exit-code -- src/app/core/api/schema.d.ts src/app/core/theme/presets.generated.json

  web:
    name: Front (lint, tests, build, e2e, visuel, axe, Lighthouse)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx ng test --watch=false
      - run: npm run build
      - name: Budget JS initial ≤ 150 Ko gzip
        run: node scripts/check-bundle.mjs 150
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=public
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report }
      - name: Lighthouse CI (mobile, /malick)
        run: |
          USE_FIXTURES=true PORT=4000 node dist/web/server/server.mjs &
          sleep 3
          for i in $(seq 1 10); do curl -s -o /dev/null http://localhost:4000/malick; done
          npx -y @lhci/cli@0.14 autorun --config=./lighthouserc.json

  api:
    name: API (tests unitaires + intégration Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jacoco, path: services/api/target/site/jacoco }

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [web, api]
    steps:
      - uses: actions/checkout@v4
      - run: cp infra/.env.example infra/.env
      - run: docker compose -f infra/docker-compose.yml build

  e2e-fullstack:
    name: E2E bout-en-bout (stack Docker)
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: cp infra/.env.example infra/.env
      - run: docker compose -f infra/docker-compose.yml up -d --build --wait
      - working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          E2E_BASE_URL=https://localhost npx playwright test --project=fullstack
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color | tail -300
