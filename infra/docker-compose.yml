# LinkMe — stack complète : reverse proxy HTTPS (Caddy) → web (Angular SSR) + api (Spring Boot) → PostgreSQL
# Démarrage : cp .env.example .env && docker compose up --build   →  https://localhost  (démo : /malick)
name: linkme

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linkme}
      POSTGRES_USER: ${POSTGRES_USER:-linkme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../services/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-linkme}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-linkme}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      MEDIA_DIR: /data/media
    volumes:
      - media:/data/media
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/actuator/health/readiness']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  web:
    build:
      context: ../apps/web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,web},${SITE_DOMAIN:-localhost}
      USE_FIXTURES: 'false'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/healthz']
      interval: 10s
      timeout: 5s
      retries: 10

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
