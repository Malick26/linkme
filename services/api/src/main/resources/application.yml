spring:
  application:
    name: linkme-api
  profiles:
    default: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/linkme}
    username: ${SPRING_DATASOURCE_USERNAME:linkme}
    password: ${SPRING_DATASOURCE_PASSWORD:linkme}
    hikari:
      maximum-pool-size: 15
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        timezone.default_storage: NORMALIZE_UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never
    timeout: 30d
  jackson:
    default-property-inclusion: non_absent
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        name: LM_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
        max-age: 30d
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${OPENAPI_DOCS_ENABLED:true}

logging:
  level:
    root: INFO
    com.linkme: INFO

app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:4200}
  seed-demo: ${SEED_DEMO:false}
  commission-percent: ${PLATFORM_COMMISSION_PERCENT:8}
  mail-from: ${MAIL_FROM:LinkMe <no-reply@example.com>}
  media:
    dir: ${MEDIA_DIR:./data/media}
    local-uploads-enabled: ${LOCAL_UPLOADS_ENABLED:true}
    max-bytes: 8388608
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  payments:
    default-provider: ${PAYMENT_DEFAULT_PROVIDER:mock}
    mock:
      enabled: ${PAYMENT_MOCK_ENABLED:false}
      webhook-secret: ${PAYMENT_MOCK_WEBHOOK_SECRET:}
    paydunya:
      master-key: ${PAYDUNYA_MASTER_KEY:}
      private-key: ${PAYDUNYA_PRIVATE_KEY:}
      token: ${PAYDUNYA_TOKEN:}
      mode: ${PAYDUNYA_MODE:test}
    cinetpay:
      api-key: ${CINETPAY_API_KEY:}
      site-id: ${CINETPAY_SITE_ID:}
      secret-key: ${CINETPAY_SECRET_KEY:}
  rate-limits:
    auth-per-minute: 10
    contact-per-10-minutes: 5
    checkout-per-minute: 10
    events-per-minute: 120
    webhooks-per-minute: 60
    uploads-per-minute: 30
